name: Build Qwentex iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Qwentex
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f Qwentex.xcodeproj/project.pbxproj
          test -f Qwentex/QwentexApp.swift
          test -f Qwentex/ChatStore.swift
          test -f Qwentex/ChatView.swift
          test -f Qwentex/Info.plist
          echo "Project files are present."

      - name: Show Xcode version and schemes (fail fast)
        run: |
          xcodebuild -version
          xcodebuild -list -project Qwentex.xcodeproj

      - name: Build Qwentex (save full log)
        run: |
          set -o pipefail
          xcodebuild \
            -project Qwentex.xcodeproj \
            -scheme Qwentex \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Qwentex.app Payload/
          zip -r Qwentex-unsigned.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Qwentex-unsigned-IPA
          path: Qwentex-unsigned.ipa

      - name: Upload build log if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Qwentex-build-diagnostics
          path: |
            xcodebuild.log
            build
          if-no-files-found: ignore
